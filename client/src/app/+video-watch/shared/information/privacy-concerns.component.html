<div class="privacy-concerns" *ngIf="display">
  <div class="privacy-concerns-text">
    <span class="me-2">
      <strong i18n>Friendly Reminder:</strong>&#32;
      <ng-container i18n>
        sharing may send technical info (like public IP) to other peers.
      </ng-container>
    </span>
  </div>

  <button i18n class="ms-2 peertube-button primary-button" (click)="acceptedPrivacyConcern()">
    OK
  </button>
</div>
